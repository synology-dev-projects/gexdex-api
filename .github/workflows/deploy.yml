name: Branch-Based Deployment Pipeline

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-branch:
    runs-on: self-hosted

    steps:
      # 0. CHECKOUT LATEST REPO COMMIT
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      # 1. SETUP & CODE SYNC
      - name: Sync Workspace & Configure Paths
        run: |
          umask 002
          mkdir -p ../../conf
          if [ ! -f ../../conf/syno_paths.env ]; then
            echo "SYNOLOGY_ROOT_PATH=/volume2/homes/rachardv/git-repos" > ../../conf/syno_paths.env
          fi
          source ../../conf/syno_paths.env

          # Ensure SYNOLOGY_ROOT_PATH points to real git-repos folder without trailing slash
          [ "$SYNOLOGY_ROOT_PATH" = "/volume2/docker" ] && SYNOLOGY_ROOT_PATH="/volume2/homes/rachardv/git-repos"
          SYNOLOGY_ROOT_PATH="${SYNOLOGY_ROOT_PATH%/}"

          BRANCH_NAME="${{ github.ref_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          TARGET_PATH="${SYNOLOGY_ROOT_PATH}/${BRANCH_NAME}/${REPO_NAME}"

          # Master common-lib & common_config host locations
          COMMON_LIB_HOST_PATH="${SYNOLOGY_ROOT_PATH}/${BRANCH_NAME}/common-lib/common_lib"
          [ ! -d "$COMMON_LIB_HOST_PATH" ] && COMMON_LIB_HOST_PATH="${SYNOLOGY_ROOT_PATH}/master/common-lib/common_lib"

          COMMON_CONFIG_HOST_PATH="${SYNOLOGY_ROOT_PATH}/${BRANCH_NAME}/common_config"
          [ ! -d "$COMMON_CONFIG_HOST_PATH" ] && COMMON_CONFIG_HOST_PATH="${SYNOLOGY_ROOT_PATH}/master/common_config"

          echo "📂 Target Path: $TARGET_PATH"
          echo "DEPLOY_DIR=$TARGET_PATH" >> $GITHUB_ENV
          echo "COMMON_LIB_HOST_PATH=$COMMON_LIB_HOST_PATH" >> $GITHUB_ENV
          echo "COMMON_CONFIG_HOST_PATH=$COMMON_CONFIG_HOST_PATH" >> $GITHUB_ENV

          sudo mkdir -p "$TARGET_PATH"
          sudo chown -R 1026:100 "$TARGET_PATH" 2>/dev/null || sudo chown -R rachardv:users "$TARGET_PATH"
          sudo rm -rf "$TARGET_PATH"/*

          echo "🚀 Copying latest project files..."
          cp -r main.py "$TARGET_PATH/"
          cp -r app "$TARGET_PATH/"
          cp -r Dockerfile "$TARGET_PATH/"
          cp -r docker-compose.yml "$TARGET_PATH/"
          cp -r tests "$TARGET_PATH/"
          cp requirements.txt "$TARGET_PATH/"

          sudo chown -R 1026:100 "$TARGET_PATH" 2>/dev/null || sudo chown -R rachardv:users "$TARGET_PATH"
          chmod -R 775 "$TARGET_PATH"

      # 2. DOCKER ISOLATED UNIT TESTING
      - name: Run Unit Tests
        run: |
          echo "🧪 Running unit tests in isolated Docker container..."
          cd "${{ env.DEPLOY_DIR }}"
          docker build --target test -t gexdex-api:test .

      # 3. CONFIGURE DYNAMIC PORTS & DEPLOYMENT
      - name: Configure Port & Environment
        run: |
          if [ "${{ github.ref_name }}" == "develop" ]; then
            echo "PORT=8091" >> $GITHUB_ENV
            echo "CONTAINER_NAME=gexdex-api-dev" >> $GITHUB_ENV
            echo "🚀 Target Environment: STAGING (Ephemeral)"
          else
            echo "PORT=8090" >> $GITHUB_ENV
            echo "CONTAINER_NAME=gexdex-api-prod" >> $GITHUB_ENV
            echo "🐳 Target Environment: PRODUCTION (24/7)"
          fi
          echo "COMMON_LIB_PATH=${{ env.COMMON_LIB_HOST_PATH }}" >> $GITHUB_ENV
          echo "COMMON_CONFIG_PATH=${{ env.COMMON_CONFIG_HOST_PATH }}" >> $GITHUB_ENV

      # 4. SPIN UP CONTAINER (Master & Develop)
      - name: Spin Up Docker Container
        run: |
          cd "${{ env.DEPLOY_DIR }}"
          echo "🚀 Spinning up container ${CONTAINER_NAME} on port ${PORT}..."
          
          docker compose down || true
          docker compose build
          docker compose up -d --force-recreate
          sleep 5

      # 5. RUN LIVE HTTP ENDPOINT TESTS (Master & Develop)
      - name: Run Live HTTP Integration Endpoint Tests
        run: |
          echo "📡 Testing Live HTTP Endpoints on Port ${{ env.PORT }}..."
          
          # Determine reachable host IP and wait for API to become ready
          HOST_IP=""
          for i in {1..15}; do
            for candidate in "127.0.0.1" "172.17.0.1" "192.168.1.68"; do
              if curl -s --connect-timeout 2 "http://${candidate}:${{ env.PORT }}/health" >/dev/null 2>&1; then
                HOST_IP="$candidate"
                break 2
              fi
            done
            echo "⏳ Waiting for API to become ready on port ${{ env.PORT }} (attempt $i/15)..."
            sleep 2
          done
          
          if [ -z "$HOST_IP" ]; then
            echo "❌ CRITICAL ERROR: Could not reach the API on any expected IP. The container might have crashed."
            echo "📜 Container Logs:"
            docker logs ${{ env.CONTAINER_NAME }}
            exit 1
          fi

          echo "🌐 Testing against host IP: $HOST_IP"
          
          # Health check
          curl -s -f "http://${HOST_IP}:${{ env.PORT }}/health" > /dev/null || (echo "❌ Health check failed" && exit 1)
          
          # Assistant summary endpoint
          curl -s -f -H "X-API-Key: YOUR_SECRET_API_KEY_HERE" "http://${HOST_IP}:${{ env.PORT }}/api/v1/gexdex/assistant-summary?ticker=AAPL" > /dev/null || (echo "❌ Assistant summary endpoint failed" && exit 1)
          
          # Chart image PNG endpoint
          curl -s -f -H "X-API-Key: YOUR_SECRET_API_KEY_HERE" "http://${HOST_IP}:${{ env.PORT }}/api/v1/gexdex/chart.png?ticker=AAPL" -o /dev/null || (echo "❌ Chart PNG endpoint failed" && exit 1)

          echo "✅ All live HTTP integration endpoint tests passed on port ${{ env.PORT }}!"

      # 6. CLEANUP (Only on Develop)
      - name: Tear Down Ephemeral Staging Container
        if: always() && github.ref_name == 'develop'
        run: |
          cd "${{ env.DEPLOY_DIR }}"
          echo "🧹 Cleaning up ephemeral staging container on port ${{ env.PORT }}..."
          docker compose down || true

      # 7. AUTO-PROMOTE DEVELOP TO MASTER (Only on Develop)
      - name: Auto-Promote Verified Develop to Master
        if: github.ref_name == 'develop'
        run: |
          echo "✅ Develop integration tests verified. Auto-promoting to Master..."
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git fetch origin develop
          git checkout master 2>/dev/null || git checkout -b master origin/master
          git pull origin master
          git merge origin/develop --no-ff -m "Auto-merge develop to master"
          git push origin master
