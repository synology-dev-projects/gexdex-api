name: Branch-Based Deployment Pipeline

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-branch:
    runs-on: self-hosted

    steps:
      # 0. CHECKOUT LATEST REPO COMMIT
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. SETUP & CODE SYNC
      - name: Sync Workspace & Bundle Dependencies
        run: |
          umask 002
          mkdir -p ../../conf
          if [ ! -f ../../conf/syno_paths.env ]; then
            echo "SYNOLOGY_ROOT_PATH=/volume2/docker" > ../../conf/syno_paths.env
          fi
          source ../../conf/syno_paths.env

          BRANCH_NAME="${{ github.ref_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          TARGET_PATH="${SYNOLOGY_ROOT_PATH}/${BRANCH_NAME}/${REPO_NAME}"
          COMMON_CONFIG_PATH="${SYNOLOGY_ROOT_PATH}/${BRANCH_NAME}/common_config"

          echo "📂 Target Path: $TARGET_PATH"
          echo "DEPLOY_DIR=$TARGET_PATH" >> $GITHUB_ENV
          echo "CONFIG_DIR=$COMMON_CONFIG_PATH" >> $GITHUB_ENV

          mkdir -p "$TARGET_PATH" "$COMMON_CONFIG_PATH"
          rm -rf "$TARGET_PATH"/*

          echo "🚀 Copying latest project files..."
          cp -r main.py "$TARGET_PATH/"
          [ -d app ] && cp -r app "$TARGET_PATH/"
          cp -r Dockerfile "$TARGET_PATH/"
          cp -r docker-compose.yml "$TARGET_PATH/"
          [ -d tests ] && cp -r tests "$TARGET_PATH/"
          [ -f requirements.txt ] && cp requirements.txt "$TARGET_PATH/"

          # Locate production master deployment of common-lib
          HOMES_MASTER_COMMON_LIB="/volume2/homes/rachardv/git-repos/master/common-lib/common_lib"
          MASTER_COMMON_LIB="${SYNOLOGY_ROOT_PATH}/master/common-lib/common_lib"
          DEVELOP_COMMON_LIB="${SYNOLOGY_ROOT_PATH}/develop/common-lib/common_lib"

          COMMON_LIB_SRC=""
          if [ -d "$HOMES_MASTER_COMMON_LIB" ]; then
            COMMON_LIB_SRC="$HOMES_MASTER_COMMON_LIB"
          elif [ -d "$MASTER_COMMON_LIB" ]; then
            COMMON_LIB_SRC="$MASTER_COMMON_LIB"
          elif [ -d "$DEVELOP_COMMON_LIB" ]; then
            COMMON_LIB_SRC="$DEVELOP_COMMON_LIB"
          elif [ -d "../common-lib/common_lib" ]; then
            COMMON_LIB_SRC="../common-lib/common_lib"
          fi

          if [ -n "$COMMON_LIB_SRC" ]; then
            echo "📦 Copying common_lib from $COMMON_LIB_SRC..."
            rm -rf "$TARGET_PATH/common_lib"
            cp -r "$COMMON_LIB_SRC" "$TARGET_PATH/common_lib"
          else
            echo "❌ ERROR: common_lib master deployment not found at $MASTER_COMMON_LIB!"
            exit 1
          fi

          sudo chown -R 1026:100 "$TARGET_PATH"
          chmod -R 775 "$TARGET_PATH"

          ENV_FILE="${COMMON_CONFIG_PATH}/.env"
          echo "API_KEY=${{ secrets.API_KEY || 'YOUR_SECRET_API_KEY_HERE' }}" > "$ENV_FILE"
          chmod 644 "$ENV_FILE"

      # 2. DOCKER ISOLATED UNIT TESTING
      - name: Run Unit Tests
        run: |
          echo "🧪 Running unit tests in isolated Docker container..."
          cd "${{ env.DEPLOY_DIR }}"
          docker build --target test -t gexdex-api:test .

      # 3. DEVELOP BRANCH: EPHEMERAL STAGING CONTAINER & LIVE API TESTING
      - name: Spin Up Ephemeral Staging Container (Port 8091)
        if: github.ref_name == 'develop'
        run: |
          cd "${{ env.DEPLOY_DIR }}"
          echo "🚀 Spinning up ephemeral staging container on port 8091..."
          export CONTAINER_NAME=gexdex-api-dev
          export PORT=8091
          export APP_PATH="${{ env.DEPLOY_DIR }}/app"
          export COMMON_LIB_PATH="${{ env.DEPLOY_DIR }}/common_lib"
          export COMMON_CONFIG_PATH="${{ env.CONFIG_DIR }}"

          docker compose down || true
          docker compose build --no-cache
          docker compose up -d --force-recreate
          sleep 5

      - name: Run Live HTTP Integration Endpoint Tests (Port 8091)
        if: github.ref_name == 'develop'
        run: |
          echo "📡 Testing Live HTTP Endpoints on Ephemeral Container (Port 8091)..."
          
          # Health check
          curl -f http://127.0.0.1:8091/health || (echo "❌ Health check failed" && exit 1)
          
          # Assistant summary endpoint
          curl -f -H "X-API-Key: YOUR_SECRET_API_KEY_HERE" "http://127.0.0.1:8091/api/v1/gexdex/assistant-summary?ticker=AAPL" || (echo "❌ Assistant summary endpoint failed" && exit 1)
          
          # Chart image PNG endpoint
          curl -f -H "X-API-Key: YOUR_SECRET_API_KEY_HERE" "http://127.0.0.1:8091/api/v1/gexdex/chart.png?ticker=AAPL" -o /dev/null || (echo "❌ Chart PNG endpoint failed" && exit 1)

          echo "✅ All live HTTP integration endpoint tests passed on port 8091!"

      - name: Tear Down Ephemeral Staging Container
        if: always() && github.ref_name == 'develop'
        run: |
          cd "${{ env.DEPLOY_DIR }}"
          echo "🧹 Cleaning up ephemeral staging container on port 8091..."
          export CONTAINER_NAME=gexdex-api-dev
          export PORT=8091
          docker compose down || true

      # 4. MASTER BRANCH: PRODUCTION CONTAINER DEPLOYMENT (Port 8090)
      - name: Launch 24/7 Production Container on Master (Port 8090)
        if: github.ref_name == 'master'
        run: |
          cd "${{ env.DEPLOY_DIR }}"
          echo "🐳 Launching 24/7 Production Docker Container on Master (Port 8090)..."
          export CONTAINER_NAME=gexdex-api-container
          export PORT=8090
          export APP_PATH="${{ env.DEPLOY_DIR }}/app"
          export COMMON_LIB_PATH="${{ env.DEPLOY_DIR }}/common_lib"
          export COMMON_CONFIG_PATH="${{ env.CONFIG_DIR }}"

          docker compose down || true
          docker compose build --no-cache
          docker compose up -d --force-recreate
