name: Branch-Based Deployment Pipeline

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-branch:
    runs-on: self-hosted

    steps:
      # 0. CHECKOUT LATEST REPO COMMIT
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. SETUP & CODE SYNC
      - name: Sync Workspace & Configure Paths
        run: |
          umask 002
          mkdir -p ../../conf
          if [ ! -f ../../conf/syno_paths.env ]; then
            echo "SYNOLOGY_ROOT_PATH=/volume2/homes/rachardv/git-repos" > ../../conf/syno_paths.env
          fi
          source ../../conf/syno_paths.env

          # Ensure SYNOLOGY_ROOT_PATH points to real git-repos folder
          [ "$SYNOLOGY_ROOT_PATH" = "/volume2/docker" ] && SYNOLOGY_ROOT_PATH="/volume2/homes/rachardv/git-repos"

          BRANCH_NAME="${{ github.ref_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          TARGET_PATH="${SYNOLOGY_ROOT_PATH}/${BRANCH_NAME}/${REPO_NAME}"

          # Master common-lib & common_config host locations
          COMMON_LIB_HOST_PATH="${SYNOLOGY_ROOT_PATH}/${BRANCH_NAME}/common-lib/common_lib"
          [ ! -d "$COMMON_LIB_HOST_PATH" ] && COMMON_LIB_HOST_PATH="${SYNOLOGY_ROOT_PATH}/master/common-lib/common_lib"

          COMMON_CONFIG_HOST_PATH="${SYNOLOGY_ROOT_PATH}/${BRANCH_NAME}/common_config"
          [ ! -d "$COMMON_CONFIG_HOST_PATH" ] && COMMON_CONFIG_HOST_PATH="${SYNOLOGY_ROOT_PATH}/master/common_config"

          echo "📂 Target Path: $TARGET_PATH"
          echo "DEPLOY_DIR=$TARGET_PATH" >> $GITHUB_ENV
          echo "COMMON_LIB_HOST_PATH=$COMMON_LIB_HOST_PATH" >> $GITHUB_ENV
          echo "COMMON_CONFIG_HOST_PATH=$COMMON_CONFIG_HOST_PATH" >> $GITHUB_ENV

          mkdir -p "$TARGET_PATH"
          rm -rf "$TARGET_PATH"/*

          echo "🚀 Copying latest project files..."
          cp -r main.py "$TARGET_PATH/"
          cp -r app "$TARGET_PATH/"
          cp -r Dockerfile "$TARGET_PATH/"
          cp -r docker-compose.yml "$TARGET_PATH/"
          cp -r tests "$TARGET_PATH/"
          cp requirements.txt "$TARGET_PATH/"

          sudo chown -R 1026:100 "$TARGET_PATH"
          chmod -R 775 "$TARGET_PATH"

      # 2. DOCKER ISOLATED UNIT TESTING
      - name: Run Unit Tests
        run: |
          echo "🧪 Running unit tests in isolated Docker container..."
          cd "${{ env.DEPLOY_DIR }}"
          docker build --target test -t gexdex-api:test .

      # 3. DEVELOP BRANCH: EPHEMERAL STAGING CONTAINER & LIVE API TESTING
      - name: Spin Up Ephemeral Staging Container (Port 8091)
        if: github.ref_name == 'develop'
        run: |
          cd "${{ env.DEPLOY_DIR }}"
          echo "🚀 Spinning up ephemeral staging container on port 8091..."
          export CONTAINER_NAME=gexdex-api-dev
          export PORT=8091
          export APP_PATH="${{ env.DEPLOY_DIR }}/app"
          export COMMON_LIB_PATH="${{ env.COMMON_LIB_HOST_PATH }}"
          export COMMON_CONFIG_PATH="${{ env.COMMON_CONFIG_HOST_PATH }}"

          docker compose down || true
          docker compose build
          docker compose up -d --force-recreate
          sleep 5

      - name: Run Live HTTP Integration Endpoint Tests (Port 8091)
        if: github.ref_name == 'develop'
        run: |
          echo "📡 Testing Live HTTP Endpoints on Ephemeral Container (Port 8091)..."
          
          # Health check
          curl -f http://127.0.0.1:8091/health || (echo "❌ Health check failed" && exit 1)
          
          # Assistant summary endpoint
          curl -f -H "X-API-Key: YOUR_SECRET_API_KEY_HERE" "http://127.0.0.1:8091/api/v1/gexdex/assistant-summary?ticker=AAPL" || (echo "❌ Assistant summary endpoint failed" && exit 1)
          
          # Chart image PNG endpoint
          curl -f -H "X-API-Key: YOUR_SECRET_API_KEY_HERE" "http://127.0.0.1:8091/api/v1/gexdex/chart.png?ticker=AAPL" -o /dev/null || (echo "❌ Chart PNG endpoint failed" && exit 1)

          echo "✅ All live HTTP integration endpoint tests passed on port 8091!"

      - name: Tear Down Ephemeral Staging Container
        if: always() && github.ref_name == 'develop'
        run: |
          cd "${{ env.DEPLOY_DIR }}"
          echo "🧹 Cleaning up ephemeral staging container on port 8091..."
          export CONTAINER_NAME=gexdex-api-dev
          export PORT=8091
          docker compose down || true

      # 4. MASTER BRANCH: PRODUCTION CONTAINER DEPLOYMENT (Port 8090)
      - name: Launch 24/7 Production Container on Master (Port 8090)
        if: github.ref_name == 'master'
        run: |
          cd "${{ env.DEPLOY_DIR }}"
          echo "🐳 Launching 24/7 Production Docker Container on Master (Port 8090)..."
          export CONTAINER_NAME=gexdex-api-container
          export PORT=8090
          export APP_PATH="${{ env.DEPLOY_DIR }}/app"
          export COMMON_LIB_PATH="${{ env.COMMON_LIB_HOST_PATH }}"
          export COMMON_CONFIG_PATH="${{ env.COMMON_CONFIG_HOST_PATH }}"

          docker compose down || true
          docker compose build
          docker compose up -d --force-recreate
          sleep 5

      - name: Run Live Production HTTP Integration Endpoint Tests (Port 8090)
        if: github.ref_name == 'master'
        run: |
          echo "📡 Testing Live Production HTTP Endpoints on Port 8090..."
          
          # Health check
          curl -f http://127.0.0.1:8090/health || (echo "❌ Production Health check failed" && exit 1)
          
          # Assistant summary endpoint
          curl -f -H "X-API-Key: YOUR_SECRET_API_KEY_HERE" "http://127.0.0.1:8090/api/v1/gexdex/assistant-summary?ticker=AAPL" || (echo "❌ Production Assistant summary endpoint failed" && exit 1)
          
          # Chart image PNG endpoint
          curl -f -H "X-API-Key: YOUR_SECRET_API_KEY_HERE" "http://127.0.0.1:8090/api/v1/gexdex/chart.png?ticker=AAPL" -o /dev/null || (echo "❌ Production Chart PNG endpoint failed" && exit 1)

          echo "✅ All live production HTTP integration endpoint tests passed on port 8090!"

      # 5. AUTO-PROMOTE DEVELOP TO MASTER (ONLY AFTER DEVELOP INTEGRATION TESTS PASS)
      - name: Auto-Promote Verified Develop to Master
        if: github.ref_name == 'develop'
        run: |
          echo "✅ Develop integration tests verified. Auto-promoting to Master..."
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git fetch origin develop
          git checkout master 2>/dev/null || git checkout -b master origin/master
          git pull origin master
          git merge origin/develop --no-ff -m "Auto-merge develop to master [Skip CI]"
          git push origin master
