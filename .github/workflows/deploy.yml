name: Branch-Based Deployment Pipeline

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-branch:
    runs-on: self-hosted

    steps:
      # 1. SETUP & CODE SYNC
      - name: Checkout & Sync Workspace
        run: |
          umask 002
          mkdir -p ../../conf
          if [ ! -f ../../conf/syno_paths.env ]; then
            echo "SYNOLOGY_ROOT_PATH=/volume2/docker" > ../../conf/syno_paths.env
          fi
          source ../../conf/syno_paths.env

          BRANCH_NAME="${{ github.ref_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          TARGET_PATH="${SYNOLOGY_ROOT_PATH}/${BRANCH_NAME}/${REPO_NAME}"
          COMMON_CONFIG_PATH="${SYNOLOGY_ROOT_PATH}/${BRANCH_NAME}/common_config"

          echo "📂 Target Path: $TARGET_PATH"
          echo "DEPLOY_DIR=$TARGET_PATH" >> $GITHUB_ENV
          echo "CONFIG_DIR=$COMMON_CONFIG_PATH" >> $GITHUB_ENV

          mkdir -p "$TARGET_PATH" "$COMMON_CONFIG_PATH"
          rm -rf "$TARGET_PATH"/*

          echo "🚀 Copying project files & common_lib..."
          cp -r main.py "$TARGET_PATH/"
          [ -d app ] && cp -r app "$TARGET_PATH/"
          [ -d ../common-lib/common_lib ] && cp -r ../common-lib/common_lib "$TARGET_PATH/"
          cp -r Dockerfile "$TARGET_PATH/"
          cp -r docker-compose.yml "$TARGET_PATH/"
          [ -d tests ] && cp -r tests "$TARGET_PATH/"
          [ -f requirements.txt ] && cp requirements.txt "$TARGET_PATH/"

          sudo chown -R 1026:100 "$TARGET_PATH"
          chmod -R 775 "$TARGET_PATH"

          ENV_FILE="${COMMON_CONFIG_PATH}/.env"
          echo "API_KEY=${{ secrets.API_KEY || 'YOUR_SECRET_API_KEY_HERE' }}" > "$ENV_FILE"
          chmod 644 "$ENV_FILE"

      # 2. DOCKER-NATIVE ISOLATED UNIT TESTING
      - name: Run Docker Unit Tests
        run: |
          echo "🧪 Running unit tests in isolated Docker container..."
          cd "${{ env.DEPLOY_DIR }}"
          docker build --target test -t gexdex-api:test .

      # 3. AUTO-PROMOTE & PRODUCTION CONTAINER LAUNCH
      - name: Auto-Promote to Master & Launch Container
        run: |
          if [ "${{ github.ref_name }}" = "develop" ]; then
            echo "✅ Develop verified. Auto-promoting to Master..."
            git config user.name "GitHub Actions Bot"
            git config user.email "actions@github.com"
            git fetch origin
            git checkout master 2>/dev/null || git checkout -b master origin/master
            git pull origin master
            git merge origin/develop --no-ff -m "Auto-merge develop to master"
            git push origin master
          fi

          echo "🐳 Launching Production Docker Container on Master..."
          MASTER_PATH="${SYNOLOGY_ROOT_PATH}/master/${REPO_NAME}"
          mkdir -p "$MASTER_PATH"
          cp -r "${{ env.DEPLOY_DIR }}"/* "$MASTER_PATH/" 2>/dev/null || true
          
          cd "$MASTER_PATH"
          docker compose down || true
          docker compose up -d --build
